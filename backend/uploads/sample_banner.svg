<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#31104B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Background & Grid -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Geometric Decorative Curves -->
  <circle cx="1050" cy="180" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
  <circle cx="1050" cy="180" r="220" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.25"/>

  <!-- Content Banner Typography -->
  <text x="100" y="150" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="0.18em" fill="#38BDF8">OFFICIAL ENTERPRISE ARCHITECTURE</text>
  <text x="100" y="210" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.02em" fill="#FFFFFF">Resilient Cloud Infrastructure Platform</text>
  <text x="100" y="255" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">Engineered for 99.99% high availability and multi-region failover.</text>

  <!-- Tag Pill -->
  <g transform="translate(100, 285)">
    <rect width="180" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1"/>
    <text x="90" y="23" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#38BDF8" text-anchor="middle">Brand Verified Asset</text>
  </g>
</svg>
